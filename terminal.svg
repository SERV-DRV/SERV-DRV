<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <style>
      .window { fill: #111111; rx: 8px; }
      .text { font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; font-weight: 500; fill: #fff; }
      .prompt { fill: #c678dd; } /* Purple prompt */
      .cmd { fill: #ffffff; }
      .key { fill: #e5c07b; } /* Yellow for JSON keys */
      .val { fill: #98c379; } /* Green for JSON values */
      .bracket { fill: #abb2bf; }
      
      /* Typing effect using clip-path on a covering rectangle is easier and widely supported */
      .type-cover { fill: #111111; animation: slide 1.5s steps(20, end) forwards; animation-delay: 0.5s; }
      
      .line2 { opacity: 0; animation: show 0.1s forwards; animation-delay: 2.0s; }
      .line3 { opacity: 0; animation: show 0.1s forwards; animation-delay: 2.2s; }
      .line4 { opacity: 0; animation: show 0.1s forwards; animation-delay: 2.4s; }
      .line5 { opacity: 0; animation: show 0.1s forwards; animation-delay: 2.6s; }
      .line6 { opacity: 0; animation: show 0.1s forwards; animation-delay: 2.8s; }
      .line7 { opacity: 0; animation: show 0.1s forwards; animation-delay: 3.0s; }
      
      /* Cursors */
      .cursor1 { animation: blink 0.8s step-end infinite, hide 0.1s forwards; animation-delay: 0s, 2s; }
      .cursor2 { opacity: 0; animation: show 0.1s forwards, blink 0.8s step-end infinite; animation-delay: 3s, 3s; }

      @keyframes slide { to { transform: translateX(200px); } }
      @keyframes show { to { opacity: 1; } }
      @keyframes hide { to { opacity: 0; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background -->
  <rect class="window" width="600" height="300" />
  
  <!-- Mac Buttons -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />

  <g class="text" transform="translate(20, 65)">
    <!-- Line 1: The command -->
    <g>
      <text x="0" y="0"><tspan class="prompt">/SERV-DRV $</tspan> <tspan class="cmd">cat skills.py</tspan></text>
      <!-- Cover rect that moves right to reveal the command text -->
      <rect x="110" y="-15" width="200" height="20" class="type-cover" />
      <!-- Typing Cursor -->
      <rect x="110" y="-12" width="8" height="15" fill="#fff" class="cursor1">
        <animateTransform attributeName="transform" type="translate" values="0,0; 130,0" keyTimes="0; 1" dur="1.5s" begin="0.5s" fill="freeze" calcMode="discrete"/>
      </rect>
    </g>

    <!-- Line 2: { -->
    <text x="0" y="35" class="line2 bracket">{</text>

    <!-- Line 3: role -->
    <text x="20" y="70" class="line3"><tspan class="key">"role"</tspan>: <tspan class="val">"Full Stack Developer"</tspan>,</text>

    <!-- Line 4: studying -->
    <text x="20" y="105" class="line4"><tspan class="key">"studying"</tspan>: <tspan class="val">"Python"</tspan>,</text>

    <!-- Line 5: motto -->
    <text x="20" y="140" class="line5"><tspan class="key">"motto"</tspan>: <tspan class="val">"Code in silence. Results speak first."</tspan></text>

    <!-- Line 6: } -->
    <text x="0" y="175" class="line6 bracket">}</text>

    <!-- Final Cursor -->
    <g class="line7">
      <text x="0" y="210"><tspan class="prompt">/SERV-DRV $</tspan></text>
      <rect x="110" y="198" width="8" height="15" fill="#fff" class="cursor2" />
    </g>

  </g>
</svg>
